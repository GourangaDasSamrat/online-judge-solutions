name: Codeforces Auto Sync
on:
  schedule:
    - cron: '30 0 * * *'  # Daily at 12:30 AM UTC
  workflow_dispatch:

jobs:
  sync_solutions:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff checking

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 matplotlib

      - name: Run Codeforces Sync Script
        env:
          CODEFORCES_HANDLE: ${{ secrets.CODEFORCES_HANDLE }}
        run: |
          python .github/scripts/sync_codeforces.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage everything first so brand-new (untracked) problem folders
          # are visible to `git diff --cached`. Plain `git diff` only shows
          # changes to files git already knows about, so new solves for
          # never-before-seen problems were always invisible to it.
          git add -A

          SOLUTION_CHANGES=$(git diff --cached --name-only | grep -E '\.(py|cpp|java|js|ts|go|rs|c|cs|rb|php|kt|swift|scala|hs|txt)$' || true)

          if [ -z "$SOLUTION_CHANGES" ]; then
            echo "No new code solutions detected"
            # Nothing worth keeping (e.g. only the date line in README.md
            # changed) — discard staged changes and any stray new files.
            git reset --hard
            git clean -fd
            exit 0
          fi

          echo "New solutions detected:"
          echo "$SOLUTION_CHANGES"
          echo ""

          git commit -m "Add new Codeforces solutions - $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push

          echo "New solutions committed and pushed successfully!"
